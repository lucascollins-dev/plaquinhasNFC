<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Imprimir plaquinhas</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    body { margin: 0; font-family: system-ui, sans-serif; }

    .controles { padding: 16px; }
    .controles select, .controles button { font-size: 16px; padding: 6px 10px; margin-right: 8px; }

    .voltar {
      display: inline-block;
      margin: 12px 0 0 16px;
      font-size: 14px;
      color: #444;
      text-decoration: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 12px;
    }
    .voltar:hover { background: #f2f2f2; }

    .folha {
      width: 297mm;
      height: 210mm;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10mm;
      overflow: hidden;
      break-after: page;
      page-break-after: always;
    }
    .folha:last-child { break-after: auto; page-break-after: auto; }

    .plaquinha {
      position: relative;
      flex: 0 0 100mm;
      width: 100mm;
      height: 150mm;
      overflow: hidden;
    }
    .plaquinha .fundo {
      position: absolute;
      left: -3mm;
      top: -3mm;
      width: 106mm;
      height: 156mm;
    }
    .plaquinha .qr {
      position: absolute;
      width: 26mm;
      height: 26mm;
    }

    /* Só aparecem na tela, nunca na impressão */
    .store--name,
    .codigo--tela {
      position: absolute;
      z-index: 999;
      background-color: #000;
      color: #fff;
      font-size: 14px;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .store--name { top: 4mm; left: 4mm; }
    .codigo--tela { bottom: 4mm; left: 4mm; font-family: monospace; }

    .debug-panel {
      position: fixed; bottom: 16px; right: 16px; z-index: 1000;
      background: rgba(0,0,0,0.8); color: #fff; padding: 12px; border-radius: 8px;
      font-family: monospace; font-size: 12px; display: none;
    }
    .debug-panel.visible { display: block; }
    .debug-panel button { margin: 2px; padding: 4px 8px; }

    @media print {
      .controles, .voltar, .store--name, .codigo--tela, .debug-panel { display: none !important; }
    }
  </style>
</head>
<body>
  <a class="voltar" href="painel.html">← Voltar ao painel</a>

  <div class="controles">
    <select id="fundo">
      <option value="alternar">Alternar (Google + Instagram)</option>
      <option value="google">Só Google</option>
      <option value="instagram">Só Instagram</option>
    </select>
    <button onclick="window.print()">Imprimir</button>
    <button onclick="toggleDebug()" style="margin-left: 8px;">Debug</button>
    <p>Duas plaquinhas por folha A4 paisagem, cada uma de 100 × 150 mm.</p>
  </div>

  <div id="paginas"></div>

  <div class="debug-panel" id="debugPanel">
    <div>Google: left <span id="dbgGoogleLeft">40.46</span> top <span id="dbgGoogleTop">84.44</span></div>
    <div>Insta: left <span id="dbgInstaLeft">40.46</span> top <span id="dbgInstaTop">84.78</span></div>
    <div>
      <button onclick="adj('google','left',-0.1)">G←</button>
      <button onclick="adj('google','left',0.1)">G→</button>
      <button onclick="adj('google','top',-0.1)">G↑</button>
      <button onclick="adj('google','top',0.1)">G↓</button>
    </div>
    <div>
      <button onclick="adj('instagram','left',-0.1)">I←</button>
      <button onclick="adj('instagram','left',0.1)">I→</button>
      <button onclick="adj('instagram','top',-0.1)">I↑</button>
      <button onclick="adj('instagram','top',0.1)">I↓</button>
    </div>
    <div><button onclick="copyPos()">Copiar posições</button></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const BASE_URL = "https://plaquinhasnfc-ashy.vercel.app/index.html?c=";

    const FUNDOS = {
      google: "fundo-google.png",
      instagram: "fundo-instagram.png"
    };

    // Posição do canto superior esquerdo do QR, em mm, medida nas artes
    const POSICAO = {
      "fundo-google.png":    { left: 40.46, top: 84.44 },
      "fundo-instagram.png": { left: 40.46, top: 84.78 }
    };

    let senha = null;
    let cachedDados = null;

    function escapar(texto) {
      return String(texto).replace(/[&<>"']/g, (c) => ({
        "&": "&", "<": "<", ">": ">", '"': """, "'": "'"
      })[c]);
    }

    function gerarQR(texto) {
      const temp = document.createElement("div");
      new QRCode(temp, {
        text: texto,
        width: 800,
        height: 800,
        correctLevel: QRCode.CorrectLevel.M
      });
      return temp.querySelector("canvas").toDataURL("image/png");
    }

    function fundoPara(modo, indice) {
      if (modo === "alternar") {
        return indice % 2 === 0 ? FUNDOS.google : FUNDOS.instagram;
      }
      return FUNDOS[modo];
    }

    function plaquinhaHTML(item, fundo) {
      const pos = POSICAO[fundo];
      const imagem = gerarQR(BASE_URL + item.uniqueLink);
      const nome = item.storeName
        ? `<span class="store--name">${escapar(item.storeName)}</span>`
        : "";

      return `
        <div class="plaquinha" data-link="${escapar(item.uniqueLink)}" data-fundo="${fundo}">
          ${nome}
          <span class="codigo--tela">${escapar(item.uniqueLink)}</span>
          <img class="fundo" src="${fundo}" alt="">
          <img class="qr" src="${imagem}" alt="QR ${escapar(item.uniqueLink)}"
               style="left:${pos.left}mm; top:${pos.top}mm; width:25mm; height:25mm;">
        </div>`;
    }

    function mostrarMensagem(texto) {
      document.getElementById("paginas").innerHTML =
        `<p style="padding:16px;color:#b00">${escapar(texto)}</p>`;
    }

    async function carregarDados() {
      if (typeof QRCode === "undefined") {
        alert("A biblioteca do QR não carregou. Atualize a página com Ctrl+F5.");
        return null;
      }

      if (!senha) {
        senha = prompt("Senha de administrador:");
        if (!senha) {
          mostrarMensagem("Digite a senha para carregar as plaquinhas.");
          return null;
        }
      }

      const resposta = await fetch("/api/codigos", {
        headers: { "x-senha": senha }
      });
      const dados = await resposta.json();

      if (!Array.isArray(dados)) {
        senha = null;
        mostrarMensagem("Senha incorreta ou erro ao carregar. Atualize a página e tente de novo.");
        return null;
      }
      return dados;
    }

    function renderizar(dados) {
      const modo = document.getElementById("fundo").value;
      let html = "";

      for (let i = 0; i < dados.length; i += 2) {
        const esquerda = plaquinhaHTML(dados[i], fundoPara(modo, i));
        const direita = dados[i + 1]
          ? plaquinhaHTML(dados[i + 1], fundoPara(modo, i + 1))
          : "";
        html += `<div class="folha">${esquerda}${direita}</div>`;
      }

      document.getElementById("paginas").innerHTML = html;
    }

    function atualizarQRs() {
      document.querySelectorAll(".plaquinha").forEach(pl => {
        const fundo = pl.dataset.fundo;
        const pos = POSICAO[fundo];
        const qr = pl.querySelector(".qr");
        if (qr) {
          qr.style.left = pos.left + "mm";
          qr.style.top = pos.top + "mm";
        }
      });
    }

    async function montar() {
      if (cachedDados) {
        renderizar(cachedDados);
        return;
      }
      const dados = await carregarDados();
      if (dados) {
        cachedDados = dados;
        renderizar(dados);
      }
    }

    document.getElementById("fundo").addEventListener("change", () => {
      if (cachedDados) renderizar(cachedDados);
    });
    montar();

    function toggleDebug() {
      document.getElementById("debugPanel").classList.toggle("visible");
    }
    function adj(fundo, prop, delta) {
      const key = "fundo-" + fundo + ".png";
      POSICAO[key][prop] = Math.round((POSICAO[key][prop] + delta) * 10) / 10;
      document.getElementById("dbg" + fundo.charAt(0).toUpperCase() + fundo.slice(1) + prop.charAt(0).toUpperCase() + prop.slice(1)).textContent = POSICAO[key][prop];
      atualizarQRs();
    }
    function copyPos() {
      const txt = JSON.stringify(POSICAO, null, 2);
      navigator.clipboard.writeText(txt);
      alert("Copiado: " + txt);
    }
  </script>
</body>
</html>
