<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Imprimir plaquinhas</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    body { margin: 0; font-family: system-ui, sans-serif; }

    .controles { padding: 16px; }
    .controles select, .controles button { font-size: 16px; padding: 6px 10px; margin-right: 8px; }

    .folha {
      width: 297mm;
      height: 210mm;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10mm;
      overflow: hidden;
      break-after: page;
      page-break-after: always;
    }
    .folha:last-child { break-after: auto; page-break-after: auto; }

    .plaquinha {
      position: relative;
      flex: 0 0 100mm;
      width: 100mm;
      height: 150mm;
      overflow: hidden;
    }
    .plaquinha .fundo {
      position: absolute;
      left: -3mm;
      top: -3mm;
      width: 106mm;
      height: 156mm;
    }
    .plaquinha .qr {
      position: absolute;
      width: 26mm;
      height: 26mm;
    }

    @media print {
      .controles { display: none; }
    }
  </style>
</head>
<body>
  <div class="controles">
    <select id="fundo">
      <option value="alternar">Alternar (Google + Instagram)</option>
      <option value="google">Só Google</option>
      <option value="instagram">Só Instagram</option>
    </select>
    <button onclick="window.print()">Imprimir</button>
    <p>Duas plaquinhas por folha A4 paisagem, cada uma de 100 × 150 mm.</p>
  </div>

  <div id="paginas"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const BASE_URL = "https://plaquinhasnfc-ashy.vercel.app/index.html?c=";

    const FUNDOS = {
      google: "fundo-google.png",
      instagram: "fundo-instagram.png"
    };

    // Posição do canto superior esquerdo do QR, em mm, medida nas artes
    const POSICAO = {
      "fundo-google.png":    { left: 60.45, top: 73.96 },
      "fundo-instagram.png": { left: 60.45, top: 76.93 }
    };

    function gerarQR(texto) {
      const temp = document.createElement("div");
      new QRCode(temp, {
        text: texto,
        width: 800,
        height: 800,
        correctLevel: QRCode.CorrectLevel.M
      });
      return temp.querySelector("canvas").toDataURL("image/png");
    }

    function fundoPara(modo, indice) {
      if (modo === "alternar") {
        return indice % 2 === 0 ? FUNDOS.google : FUNDOS.instagram;
      }
      return FUNDOS[modo];
    }

    function plaquinhaHTML(item, fundo) {
      const pos = POSICAO[fundo];
      const imagem = gerarQR(BASE_URL + item.uniqueLink);
      return `
        <div class="plaquinha">
          <img class="fundo" src="${fundo}" alt="">
          <img class="qr" src="${imagem}" alt="QR ${item.uniqueLink}"
               style="left:${pos.left}mm; top:${pos.top}mm;">
        </div>`;
    }

    async function montar() {
      if (typeof QRCode === "undefined") {
        alert("A biblioteca do QR não carregou. Atualize a página com Ctrl+F5.");
        return;
      }

      const dados = await (await fetch("dados.json")).json();
      const modo = document.getElementById("fundo").value;
      let html = "";

      // Duas plaquinhas por folha: índices 0-1, 2-3, 4-5...
      for (let i = 0; i < dados.length; i += 2) {
        const esquerda = plaquinhaHTML(dados[i], fundoPara(modo, i));
        const direita = dados[i + 1]
          ? plaquinhaHTML(dados[i + 1], fundoPara(modo, i + 1))
          : "";
        html += `<div class="folha">${esquerda}${direita}</div>`;
      }

      document.getElementById("paginas").innerHTML = html;
    }

    document.getElementById("fundo").addEventListener("change", montar);
    montar();
  </script>
</body>
</html>
